const mk=(ans,exs,bad=[])=>{const s=[ans];exs.forEach(x=>{if(s.length<4&&!s.includes(x)&&!bad.includes(x)&&(typeof x!=='number'||x>0))s.push(x)});
for(let d=1;typeof ans==='number'&&s.length<4;d++)[ans+d,ans-d].forEach(x=>{if(s.length<4&&x>0&&!s.includes(x)&&!bad.includes(x))s.push(x)});
const o=shuffle(s);return{o:o.map(String),a:o.indexOf(ans)}};

/* ---------- Geradores de perguntas ---------- */
const pas1=()=>{const N=rnd(4,6),r=rnd(2,N),c=rnd(1,r-1),v=C(r,c),l=C(r-1,c-1),d=C(r-1,c);
return{p:'Qual número está escondido no triângulo de Pascal?',v:tri(N,[r,c]),...mk(v,[l,d,v+1,v-1]),e:`Cada número é a soma dos dois que estão logo acima dele: ${l} + ${d} = <b>${v}</b>.`,h:'Olhe para os dois números imediatamente acima do ?'}};
const pas2=()=>{const n=rnd(3,7);
return{p:`Qual é a <b>soma</b> de todos os números da linha ${n}?`,v:`<div class="tri"><div class="pr">${row(n).map(x=>`<span class="pc">${x}</span>`).join('')}</div></div>`,...mk(2**n,[2*n,n*n,2**n-1,2**(n+1)]),e:`A soma da linha n é sempre 2<sup>n</sup>. Aqui: ${row(n).join(' + ')} = 2<sup>${n}</sup> = <b>${2**n}</b>.`,h:'Teste nas linhas pequenas: 1, 1+1, 1+2+1… o que acontece com a soma?'}};
const pas3=()=>{const n=rnd(4,6),f=m=>row(m).join(' · '),bad=row(n).map((c,i)=>i===1||i===n-1?c+1:c).join(' · ');
return{p:`Qual destas é a <b>linha ${n}</b> do triângulo de Pascal? <span class="sm">(a primeira linha é a linha 0)</span>`,v:'',...mk(f(n),[f(n-1),f(n+1),bad]),e:`A linha ${n} começa e termina com 1, tem ${n+1} números e é simétrica: ${f(n)}.`,h:'A linha n tem n + 1 números, é simétrica e soma 2<sup>n</sup>.'}};
const c1=()=>{const n=rnd(5,9),k=rnd(2,n-2),m=Math.min(k,n-k),v=C(n,k),nu=Array.from({length:m},(_,i)=>n-i);
return{p:`Quanto vale ${bn(n,k)}? <span class="sm">(lê-se “${n} escolhe ${k}”)</span>`,v:'',...mk(v,[C(n,k-1),C(n,k+1),n*k,v+n]),e:`${bn(n,k)} = ${n}! / (${k}! · ${n-k}!). Cortando o maior fatorial: ${nu.join(' · ')} / ${fact(m)} = <b>${v}</b>.`,h:'Use n! / (k! · (n − k)!) e simplifique os fatoriais.'}};
const c2=()=>{const n=rnd(7,12);let k;do{k=rnd(2,n-2)}while(2*k===n);
return{p:`Complete usando a simetria: ${bn(n,k)} = ${bn(n,'□')}, com □ diferente de ${k}.`,v:'',...mk(n-k,[k+1,n-k+1,n-k-1,n+k],[k]),e:`Simetria: ${bn('n','k')} = ${bn('n','n − k')}. Então □ = ${n} − ${k} = <b>${n-k}</b>. Na linha ${n} do triângulo, os números se repetem de trás para frente.`,h:'Na mesma linha do triângulo, o número da posição k é igual ao da posição n − k.'}};
const c3=()=>{const n=rnd(4,7),k=rnd(1,n-1),a=C(n,k),b=C(n,k+1);
return{p:`Sabendo que ${bn(n,k)} = ${a} e ${bn(n,k+1)} = ${b}, quanto vale ${bn(n+1,k+1)}?`,v:'',...mk(a+b,[a,b,a+b+1,a+b-1]),e:`Relação de Stifel: ${bn('n','k')} + ${bn('n','k+1')} = ${bn('n+1','k+1')}. Aqui: ${a} + ${b} = <b>${a+b}</b>. É a regra do triângulo: somar os dois de cima.`,h:'No triângulo de Pascal, quem fica logo abaixo desses dois números?'}};
const c4=()=>{const n=rnd(8,25),[t,v,why]=pick([[0,1,'Só há 1 jeito de escolher nenhum elemento: não escolher nada.'],[1,n,`Escolher 1 entre ${n} dá ${n} possibilidades.`],[n,1,'Escolher todos os elementos só tem 1 jeito.'],[n-1,n,`Escolher ${n-1} entre ${n} é o mesmo que escolher quem fica de fora: ${n} possibilidades.`]]);
return{p:`Quanto vale ${bn(n,t)}?`,v:'',...mk(v,[1,n,n-1,n+1]),e:`${why} Resultado: <b>${v}</b>.`,h:'Pense em quantas maneiras existem de escolher esses elementos, ou olhe as bordas do triângulo.'}};
const n1=()=>{const n=rnd(2,3),neg=Math.random()<.5,[a,b]=pick([['x','y'],['a','b'],['p','q']]),co=row(n),sg=co.map((_,i)=>neg&&i%2?-1:1),f=(c,s)=>ex(n,a,b,c,s);
return{p:`Qual é o desenvolvimento de <span class="big">(${a} ${neg?'−':'+'} ${b})<sup>${n}</sup></span>?`,v:'',...mk(f(co,sg),[f(co.map(()=>1),sg),f(co.map((c,i)=>i&&i<n?0:c),sg),f(co,sg.map((_,i)=>neg?1:i%2?-1:1)),f(co.map((c,i)=>i&&i<n?c+1:c),sg)]),e:`Os coeficientes vêm da linha ${n} do triângulo: ${co.join(', ')}. ${neg?'Como é uma diferença, os sinais se alternam: + − + −…':'Como é uma soma, todos os sinais são positivos.'}`,h:'Procure a linha n do triângulo de Pascal para os coeficientes.'}};
const n2=()=>{const n=rnd(3,5),a=rnd(2,3),k=rnd(1,n-1),c=C(n,k),v=c*a**(n-k);
return{p:`Qual é o coeficiente de <span class="big">${sup('x',k)}</span> no desenvolvimento de <span class="big">(x + ${a})<sup>${n}</sup></span>?`,v:'',...mk(v,[c,a**(n-k),c*a**k,c*a]),e:`Termo geral: ${bn(n,k)} · ${sup('x',k)} · ${sup(a,n-k)}. O coeficiente é ${c} · ${a**(n-k)} = <b>${v}</b>.`,h:'O termo geral é C(n, k) · x<sup>k</sup> · a<sup>n−k</sup>. Não esqueça a potência do número!'}};
const n3a=()=>{const n=rnd(5,12);return{p:`Quantos termos tem o desenvolvimento de <span class="big">(a + b)<sup>${n}</sup></span>?`,v:'',...mk(n+1,[n,n+2,2*n]),e:`A linha ${n} do triângulo tem ${n+1} números, então são <b>${n+1}</b> termos, de a<sup>${n}</sup> até b<sup>${n}</sup>.`,h:'Conte quantos números tem a linha n do triângulo de Pascal.'}};
const n3b=()=>{const n=rnd(3,6);return{p:`Qual é a soma dos coeficientes de <span class="big">(x + y)<sup>${n}</sup></span>?`,v:'',...mk(2**n,[2*n,n*n,2**n-1,2**(n+1)]),e:`Troque x e y por 1: (1 + 1)<sup>${n}</sup> = 2<sup>${n}</sup> = <b>${2**n}</b>. É a soma da linha ${n} do triângulo.`,h:'Que valores de x e y deixam cada termo igual ao seu coeficiente?'}};
const n3=()=>pick([n3a,n3b])();
const n4=()=>{const n=rnd(4,6),k=rnd(1,n-1),co=row(n),h=co.map((c,i)=>i===k?'?':c),v=co[k];
return{p:'Complete o coeficiente que falta:',v:`<div class="fm">(x + 1)<sup>${n}</sup> = ${ex(n,'x','',h,h.map(()=>1))}</div>`,...mk(v,[co[k-1],co[k+1],v+n,v-1]),e:`Os coeficientes são a linha ${n} do triângulo: ${co.join(', ')}. O que falta é <b>${v}</b>.`,h:'Use a linha n do triângulo de Pascal.'}};
